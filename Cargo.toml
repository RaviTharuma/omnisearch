[package]
name = "omnisearch"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Parallel multi-provider MCP search server: Brave, GitHub, web, social, extract, RRF merge."
license = "Apache-2.0"
authors = ["Ravi Tharuma"]
repository = "https://github.com/RaviTharuma/omnisearch"
homepage = "https://github.com/RaviTharuma/omnisearch"
readme = "README.md"
keywords = ["mcp", "search", "brave", "github", "llm"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "omnisearch"
path = "src/lib.rs"

[[bin]]
name = "omnisearch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
ipnet = "2.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time", "net", "fs", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
