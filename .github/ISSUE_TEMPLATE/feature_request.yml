name: Feature request
description: Propose a new capability, tool, or config option
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Large provider additions should cite official API docs.
        See [CONTRIBUTING.md](https://github.com/RaviTharuma/omnisearch/blob/main/CONTRIBUTING.md) and [DISCLAIMER.md](https://github.com/RaviTharuma/omnisearch/blob/main/DISCLAIMER.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Tools, arguments, env vars, or docs you want. Note breaking changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you evaluated.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to official docs, related issues, priority for your use case.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues / PRs for similar requests
          required: true
        - label: This does not request bypassing third-party ToS, CAPTCHAs, or private logins
          required: true
